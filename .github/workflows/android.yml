# Сборка Android-приложения из веб-файлов через Capacitor.
# Локально ничего ставить не нужно: Node, Java и Android SDK есть на раннере.
#
# Результат каждого запуска: nihao-debug-apk (ставится на телефон напрямую).
# Если в секретах репозитория лежат KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
# KEY_PASSWORD, дополнительно собирается подписанный nihao-release-aab для RuStore
# и Google Play.

name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Зависимости Capacitor
        run: npm install

      - name: Веб-файлы в www/
        run: npm run www

      - name: Android-проект
        run: npx cap add android

      - name: Иконки из icon.svg
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-cjk > /dev/null
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon.png
          rsvg-convert -w 1024 -h 1024 icon-maskable.svg -o assets/icon-background.png
          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon-foreground.png
          cp assets/icon.png assets/icon-only.png
          rsvg-convert -w 2732 -h 2732 icon-maskable.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#c8102e' --iconBackgroundColorDark '#c8102e' --splashBackgroundColor '#c8102e' --splashBackgroundColorDark '#c8102e'

      - name: Синхронизация
        run: npx cap sync android

      - name: Разрешение на микрофон для проверки произношения
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml

      - name: Номер версии из package.json и номера сборки
        run: |
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Отладочный APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q

      - uses: actions/upload-artifact@v4
        with:
          name: nihao-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Подписанный AAB (только при наличии ключа)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cd android
          ./gradlew bundleRelease --no-daemon -q
          cd ..
          jarsigner -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar nihao-release.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEY == 'true' }}
        with:
          name: nihao-release-aab
          path: nihao-release.aab

    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
