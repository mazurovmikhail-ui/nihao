<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Нихао: китайский с нуля</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="brand">Нихао · китайский с нуля</div>
      <div class="topline" id="topline">—</div>
    </div>
    <button class="icon-btn" id="btnBack" aria-label="Назад" hidden>‹</button>
  </div>
</header>

<main id="view"></main>

<button class="fab" id="fab" hidden>Учить урок</button>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="tab active"><span class="ti">◔</span>Сегодня</button>
  <button data-tab="lessons" class="tab"><span class="ti">课</span>Уроки</button>
  <button data-tab="dict" class="tab"><span class="ti">词</span>Словарь</button>
  <button data-tab="more" class="tab"><span class="ti">⚙</span>Ещё</button>
</nav>

<section class="session" id="session" hidden>
  <div class="sess-top">
    <button class="icon-btn dark" id="sessQuit" aria-label="Закрыть">✕</button>
    <div class="sess-bar"><i id="sessProgress"></i></div>
  </div>
  <div class="sess-body" id="sessBody"></div>
  <div class="sess-foot" id="sessionFoot"></div>
</section>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-head"><div class="sheet-title">Слово</div><button class="icon-btn dark" id="sheetClose" aria-label="Закрыть">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
